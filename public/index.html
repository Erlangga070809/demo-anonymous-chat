<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anonymous Chat - Chat anonim dengan aman dan nyaman">
    <title>Anonymous Chat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/chat.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <aside class="chat-sidebar">
            <div class="chat-sidebar-header">
                <div class="chat-user-info">
                    <div class="avatar" id="user-avatar">A</div>
                    <div>
                        <div class="chat-user-name" id="user-anonymous-id">anony #00000</div>
                        <div class="chat-user-status">
                            <span class="status-dot"></span>
                            <span data-i18n="online">Online</span>
                        </div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="icon-button" onclick="window.location.href='/settings.html'" title="Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                        </svg>
                    </button>
                    <button class="icon-button" onclick="authManager.logout()" title="Logout">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="dashboard-nav" style="padding: 16px;">
                <button class="btn btn-primary" onclick="chatManager.startMatching()" id="start-match-button" style="width: 100%;">
                    <span data-i18n="find_friend">Cari Teman</span>
                </button>
            </div>
        </aside>

        <main class="chat-main">
            <div id="match-screen" class="match-screen" style="display: none;">
                <div id="search-animation">
                    <div class="match-animation">
                        <div class="match-circle"></div>
                        <div class="match-circle"></div>
                        <div class="match-circle"></div>
                        <div class="match-icon">🔍</div>
                    </div>
                </div>
                <h3 id="search-status" class="soft-pulse" data-i18n="searching">Mencari...</h3>
                <p class="text-muted" data-i18n="search_time">Waktu pencarian: <span id="search-time">0:00</span></p>
                <button class="btn btn-secondary" onclick="chatManager.cancelMatching()" id="cancel-match-button">
                    <span data-i18n="stop_searching">Hentikan Pencarian</span>
                </button>
            </div>

            <div id="match-found" class="match-screen" style="display: none;">
                <div class="match-animation">
                    <div class="match-circle"></div>
                    <div class="match-circle"></div>
                    <div class="match-circle"></div>
                    <div class="match-icon">🎉</div>
                </div>
                <h3 data-i18n="match_found">Match Ditemukan!</h3>
                <div id="match-info"></div>
                <button class="btn btn-primary" id="start-conversation-button">
                    <span data-i18n="start_conversation">Mulai Percakapan</span>
                </button>
            </div>

            <div id="chat-screen" class="chat-main" style="display: none;">
                <header class="chat-header">
                    <div class="chat-header-info" id="match-info-header">
                        <div class="avatar">?</div>
                        <div>
                            <div class="chat-header-name">Anonymous</div>
                            <div class="chat-header-status">
                                <span class="status-dot"></span>
                                <span data-i18n="online">Online</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button class="icon-button" onclick="chatManager.blockUser()" title="Block">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z"/>
                            </svg>
                        </button>
                        <button class="icon-button" onclick="chatManager.showReportModal()" title="Report">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M15.73 3H8.27L3 8.27v7.46L8.27 21h7.46L21 15.73V8.27L15.73 3zM12 17.3c-.72 0-1.3-.58-1.3-1.3 0-.72.58-1.3 1.3-1.3.72 0 1.3.58 1.3 1.3 0 .72-.58 1.3-1.3 1.3zm1-4.3h-2V7h2v6z"/>
                            </svg>
                        </button>
                        <button class="icon-button" onclick="chatManager.endConversation()" title="End Chat">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
                            </svg>
                        </button>
                    </div>
                </header>

                <div class="chat-messages" id="messages-container">
                    <div class="chat-empty-state">
                        <div class="chat-empty-icon">💬</div>
                        <div class="chat-empty-title" data-i18n="no_messages">Belum ada pesan</div>
                        <div class="chat-empty-description" data-i18n="type_message">Ketik pesan untuk memulai percakapan</div>
                    </div>
                    <div class="typing-indicator hidden" id="typing-indicator" style="align-self: flex-start;">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div id="reply-preview" class="hidden" style="margin-bottom: 8px;"></div>
                    <div class="chat-input-container">
                        <button class="icon-button" id="attach-button" title="Attach">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
                            </svg>
                        </button>
                        <textarea class="chat-input" id="message-input" rows="1" data-i18n-placeholder="type_message" placeholder="Ketik pesan..."></textarea>
                        <button class="icon-button" id="emoji-button" title="Emoji">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                            </svg>
                        </button>
                        <button class="icon-button" id="send-button" title="Send">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/match.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await app.checkAuthStatus();
            
            if (app.currentUser) {
                document.getElementById('user-anonymous-id').textContent = app.currentUser.anonymousId;
                document.getElementById('user-avatar').textContent = app.currentUser.anonymousId.charAt(0);
                app.connectSocket();
                
                app.onSocketAuthenticated = () => {
                    chatManager.loadInitialState();
                };
            } else {
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
