<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login ke Anonymous Chat">
    <title>Login - Anonymous Chat</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <h1 class="auth-title" data-i18n="app_name">Anonymous Chat</h1>
                <p class="auth-subtitle" data-i18n="welcome_back">Selamat datang kembali</p>
            </div>

            <div id="error-message" class="auth-error hidden"></div>

            <form id="login-form" class="auth-form">
                <div class="auth-input-group">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </span>
                    <input type="email" id="email" class="input auth-input" data-i18n-placeholder="email" placeholder="Email" required>
                </div>

                <div class="auth-input-group">
                    <span class="auth-input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </span>
                    <input type="password" id="password" class="input auth-input" data-i18n-placeholder="password" placeholder="Kata Sandi" required>
                </div>

                <div class="flex justify-between items-center">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span data-i18n="remember_me">Ingat saya</span>
                    </label>
                    <a href="/forgot-password.html" class="auth-link" data-i18n="forgot_password">Lupa Kata Sandi?</a>
                </div>

                <button type="submit" class="btn btn-primary" data-i18n="login" style="width: 100%;">
                    Masuk
                </button>
            </form>

            <div class="auth-divider" data-i18n="or">atau</div>

            <div class="auth-footer">
                <span data-i18n="dont_have_account">Belum punya akun?</span>
                <a href="/register.html" class="auth-link" data-i18n="register">Daftar</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
